<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Iosevka Scripts the first fallback for Iosevka -->
<fontconfig>
  <alias>
    <family>Iosevka</family>
    <prefer>
      <family>Iosevka</family>
      <family>Iosevka Scripts</family>
    </prefer>
  </alias>
</fontconfig>
