<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Fira Code Scripts the first fallback for Fira Code -->
<fontconfig>
  <alias>
    <family>Fira Code</family>
    <prefer>
      <family>Fira Code</family>
      <family>Fira Code Scripts</family>
    </prefer>
  </alias>
</fontconfig>
