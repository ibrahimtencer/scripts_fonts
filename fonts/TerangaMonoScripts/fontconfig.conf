<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Teranga Mono Scripts the first fallback for Ubuntu Mono -->
<fontconfig>
  <alias>
    <family>Ubuntu Mono</family>
    <prefer>
      <family>Ubuntu Mono</family>
      <family>Teranga Mono Scripts</family>
    </prefer>
  </alias>
</fontconfig>
