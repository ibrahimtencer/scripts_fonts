<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make DejaVu Sans Mono Scripts the first fallback for DejaVu Sans Mono -->
<fontconfig>
  <alias>
    <family>DejaVu Sans Mono</family>
    <prefer>
      <family>DejaVu Sans Mono</family>
      <family>DejaVu Sans Mono Scripts</family>
    </prefer>
  </alias>
</fontconfig>
