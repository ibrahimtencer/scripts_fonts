<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Roboto Mono Scripts the first fallback for Roboto Mono -->
<fontconfig>
  <alias>
    <family>Roboto Mono</family>
    <prefer>
      <family>Roboto Mono</family>
      <family>Roboto Mono Scripts</family>
    </prefer>
  </alias>
</fontconfig>
