<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Baskerville Scripts the first fallback for Libre Baskerville -->
<fontconfig>
  <alias>
    <family>Libre Baskerville</family>
    <prefer>
      <family>Libre Baskerville</family>
      <family>Baskerville Scripts</family>
    </prefer>
  </alias>
</fontconfig>
