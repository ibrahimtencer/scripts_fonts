<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Roboto Scripts the first fallback for Roboto -->
<fontconfig>
  <alias>
    <family>Roboto</family>
    <prefer>
      <family>Roboto</family>
      <family>Roboto Scripts</family>
    </prefer>
  </alias>
</fontconfig>
