<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make EB Garamond Scripts the first fallback for EB Garamond -->
<fontconfig>
  <alias>
    <family>EB Garamond</family>
    <prefer>
      <family>EB Garamond</family>
      <family>EB Garamond Scripts</family>
    </prefer>
  </alias>
</fontconfig>
