<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make DejaVu Serif Scripts the first fallback for DejaVu Serif -->
<fontconfig>
  <alias>
    <family>DejaVu Serif</family>
    <prefer>
      <family>DejaVu Serif</family>
      <family>DejaVu Serif Scripts</family>
    </prefer>
  </alias>
</fontconfig>
