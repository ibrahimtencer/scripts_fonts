<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Literation Sans Scripts the first fallback for Liberation Sans -->
<fontconfig>
  <alias>
    <family>Liberation Sans</family>
    <prefer>
      <family>Liberation Sans</family>
      <family>Literation Sans Scripts</family>
    </prefer>
  </alias>
</fontconfig>
