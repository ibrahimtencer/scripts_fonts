<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make DejaVu Sans Scripts the first fallback for DejaVu Sans -->
<fontconfig>
  <alias>
    <family>DejaVu Sans</family>
    <prefer>
      <family>DejaVu Sans</family>
      <family>DejaVu Sans Scripts</family>
    </prefer>
  </alias>
</fontconfig>
