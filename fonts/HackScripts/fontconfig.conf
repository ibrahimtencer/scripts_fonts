<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Hack Scripts the first fallback for Hack -->
<fontconfig>
  <alias>
    <family>Hack</family>
    <prefer>
      <family>Hack</family>
      <family>Hack Scripts</family>
    </prefer>
  </alias>
</fontconfig>
