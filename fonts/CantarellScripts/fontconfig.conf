<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Cantarell Scripts the first fallback for Cantarell -->
<fontconfig>
  <alias>
    <family>Cantarell</family>
    <prefer>
      <family>Cantarell</family>
      <family>Cantarell Scripts</family>
    </prefer>
  </alias>
</fontconfig>
