<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Inter Scripts the first fallback for Inter -->
<fontconfig>
  <alias>
    <family>Inter</family>
    <prefer>
      <family>Inter</family>
      <family>Inter Scripts</family>
    </prefer>
  </alias>
</fontconfig>
