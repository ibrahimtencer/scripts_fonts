<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Noto Sans Scripts the first fallback for Noto Sans -->
<fontconfig>
  <alias>
    <family>Noto Sans</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Scripts</family>
    </prefer>
  </alias>
</fontconfig>
