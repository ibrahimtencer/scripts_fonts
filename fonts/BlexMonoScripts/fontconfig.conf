<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make BlexMono Scripts the first fallback for IBM Plex Mono -->
<fontconfig>
  <alias>
    <family>IBM Plex Mono</family>
    <prefer>
      <family>IBM Plex Mono</family>
      <family>BlexMono Scripts</family>
    </prefer>
  </alias>
</fontconfig>
