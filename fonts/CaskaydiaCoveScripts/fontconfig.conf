<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make CaskaydiaCove Scripts the first fallback for Cascadia Code -->
<fontconfig>
  <alias>
    <family>Cascadia Code</family>
    <prefer>
      <family>Cascadia Code</family>
      <family>CaskaydiaCove Scripts</family>
    </prefer>
  </alias>
</fontconfig>
