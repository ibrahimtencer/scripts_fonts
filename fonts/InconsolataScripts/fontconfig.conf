<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Inconsolata Scripts the first fallback for Inconsolata -->
<fontconfig>
  <alias>
    <family>Inconsolata</family>
    <prefer>
      <family>Inconsolata</family>
      <family>Inconsolata Scripts</family>
    </prefer>
  </alias>
</fontconfig>
