<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make SauceCodePro Scripts the first fallback for Source Code Pro -->
<fontconfig>
  <alias>
    <family>Source Code Pro</family>
    <prefer>
      <family>Source Code Pro</family>
      <family>SauceCodePro Scripts</family>
    </prefer>
  </alias>
</fontconfig>
