<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make JetBrains Mono Scripts the first fallback for JetBrains Mono -->
<fontconfig>
  <alias>
    <family>JetBrains Mono</family>
    <prefer>
      <family>JetBrains Mono</family>
      <family>JetBrains Mono Scripts</family>
    </prefer>
  </alias>
</fontconfig>
