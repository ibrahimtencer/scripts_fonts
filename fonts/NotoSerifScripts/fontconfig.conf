<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Noto Serif Scripts the first fallback for Noto Serif -->
<fontconfig>
  <alias>
    <family>Noto Serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif Scripts</family>
    </prefer>
  </alias>
</fontconfig>
