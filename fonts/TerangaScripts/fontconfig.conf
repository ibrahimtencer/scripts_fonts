<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Teranga Scripts the first fallback for Ubuntu -->
<fontconfig>
  <alias>
    <family>Ubuntu</family>
    <prefer>
      <family>Ubuntu</family>
      <family>Teranga Scripts</family>
    </prefer>
  </alias>
</fontconfig>
