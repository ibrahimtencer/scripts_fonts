<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Literation Serif Scripts the first fallback for Liberation Serif -->
<fontconfig>
  <alias>
    <family>Liberation Serif</family>
    <prefer>
      <family>Liberation Serif</family>
      <family>Literation Serif Scripts</family>
    </prefer>
  </alias>
</fontconfig>
