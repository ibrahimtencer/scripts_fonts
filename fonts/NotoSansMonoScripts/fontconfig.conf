<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- fontconfig: copy to ~/.config/fontconfig/conf.d/ to make Noto Sans Mono Scripts the first fallback for Noto Sans Mono -->
<fontconfig>
  <alias>
    <family>Noto Sans Mono</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Sans Mono Scripts</family>
    </prefer>
  </alias>
</fontconfig>
